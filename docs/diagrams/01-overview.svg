<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="92" fill="#0f172a"/>
  <text x="56" y="58" fill="#f8fafc" font-size="34" font-weight="700">Process structure</text>
  <text x="1224" y="58" fill="#94a3b8" font-size="18" text-anchor="end">sysbench26 · 1 of 5</text>

  <!-- main thread -->
  <rect x="56" y="132" width="250" height="300" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="56" y="132" width="250" height="54" rx="18" fill="#7c3aed"/>
  <rect x="56" y="166" width="250" height="20" fill="#7c3aed"/>
  <text x="181" y="167" fill="#fff" font-size="22" font-weight="700" text-anchor="middle">Main thread</text>
  <text x="80" y="226" fill="#1e293b" font-size="18">• parse options</text>
  <text x="80" y="262" fill="#1e293b" font-size="18">• start the Runtime</text>
  <text x="80" y="298" fill="#1e293b" font-size="18">• spawn one task per</text>
  <text x="96" y="322" fill="#1e293b" font-size="18">--threads connection</text>
  <text x="80" y="358" fill="#1e293b" font-size="18">• interval reports</text>
  <text x="80" y="394" fill="#1e293b" font-size="18">• final report</text>

  <!-- runtime frame -->
  <rect x="352" y="120" width="610" height="452" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="378" y="156" fill="#0f172a" font-size="22" font-weight="700">Runtime — one worker per connection (default)</text>

  <!-- node 0 -->
  <rect x="378" y="178" width="270" height="372" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="513" y="210" fill="#1d4ed8" font-size="19" font-weight="700" text-anchor="middle">NUMA node 0</text>
  <!-- node 1 -->
  <rect x="666" y="178" width="270" height="372" rx="16" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text x="801" y="210" fill="#047857" font-size="19" font-weight="700" text-anchor="middle">NUMA node 1</text>

  <!-- worker cards -->
  <g font-size="16" fill="#1e293b">
    <rect x="398" y="228" width="230" height="150" rx="12" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <text x="513" y="256" font-size="17" font-weight="700" text-anchor="middle" fill="#1d4ed8">Worker 0 · own CPU</text>
    <rect x="414" y="270" width="198" height="30" rx="7" fill="#dbeafe"/><text x="513" y="291" text-anchor="middle">Lua coroutine (script)</text>
    <rect x="414" y="306" width="198" height="30" rx="7" fill="#dbeafe"/><text x="513" y="327" text-anchor="middle">MySQL connection</text>
    <rect x="414" y="342" width="198" height="26" rx="7" fill="#e2e8f0"/><text x="513" y="361" text-anchor="middle" font-size="15">own io_uring · heap · arenas</text>

    <rect x="398" y="392" width="230" height="140" rx="12" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <text x="513" y="420" font-size="18" font-weight="700" text-anchor="middle" fill="#1d4ed8">Worker 2</text>
    <rect x="414" y="434" width="198" height="30" rx="7" fill="#dbeafe"/><text x="513" y="455" text-anchor="middle">Lua coroutine</text>
    <rect x="414" y="470" width="198" height="30" rx="7" fill="#dbeafe"/><text x="513" y="491" text-anchor="middle">MySQL connection</text>
    <text x="513" y="522" text-anchor="middle" fill="#64748b">…</text>

    <rect x="686" y="228" width="230" height="150" rx="12" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
    <text x="801" y="256" font-size="17" font-weight="700" text-anchor="middle" fill="#047857">Worker 1 · own CPU</text>
    <rect x="702" y="270" width="198" height="30" rx="7" fill="#d1fae5"/><text x="801" y="291" text-anchor="middle">Lua coroutine (script)</text>
    <rect x="702" y="306" width="198" height="30" rx="7" fill="#d1fae5"/><text x="801" y="327" text-anchor="middle">MySQL connection</text>
    <rect x="702" y="342" width="198" height="26" rx="7" fill="#e2e8f0"/><text x="801" y="361" text-anchor="middle" font-size="15">own io_uring · heap · arenas</text>

    <rect x="686" y="392" width="230" height="140" rx="12" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
    <text x="801" y="420" font-size="18" font-weight="700" text-anchor="middle" fill="#047857">Worker 3</text>
    <rect x="702" y="434" width="198" height="30" rx="7" fill="#d1fae5"/><text x="801" y="455" text-anchor="middle">Lua coroutine</text>
    <rect x="702" y="470" width="198" height="30" rx="7" fill="#d1fae5"/><text x="801" y="491" text-anchor="middle">MySQL connection</text>
    <text x="801" y="522" text-anchor="middle" fill="#64748b">…</text>
  </g>

  <!-- spawn arrow -->
  <path d="M306,282 L372,282" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <text x="339" y="270" fill="#7c3aed" font-size="15" text-anchor="middle">spawn</text>

  <!-- server -->
  <rect x="1010" y="220" width="214" height="252" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="1117" y="262" fill="#c2410c" font-size="22" font-weight="700" text-anchor="middle">MySQL server</text>
  <text x="1117" y="300" fill="#1e293b" font-size="17" text-anchor="middle">one TCP connection</text>
  <text x="1117" y="324" fill="#1e293b" font-size="17" text-anchor="middle">per benchmark thread</text>
  <text x="1117" y="372" fill="#9a3412" font-size="16" text-anchor="middle">text queries</text>
  <text x="1117" y="396" fill="#9a3412" font-size="16" text-anchor="middle">prepared statements</text>
  <text x="1117" y="420" fill="#9a3412" font-size="16" text-anchor="middle">pipelined commands</text>
  <path d="M922,320 L1002,320" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M922,470 L1002,430" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- memory band -->
  <rect x="56" y="604" width="1168" height="84" rx="16" fill="#0f172a"/>
  <text x="84" y="640" fill="#f8fafc" font-size="20" font-weight="700">Memory</text>
  <text x="84" y="670" fill="#cbd5e1" font-size="17">one root mmap → node-local worker heaps → per-connection heaps → per-event arenas · frame free lists</text>
</svg>
