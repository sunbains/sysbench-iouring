<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="92" fill="#0f172a"/>
  <text x="56" y="58" fill="#f8fafc" font-size="34" font-weight="700">A query, io_uring architecture</text>
  <text x="1224" y="58" fill="#94a3b8" font-size="18" text-anchor="end">--io-blocking=off · 3 of 5</text>

  <g font-size="19" font-weight="700" text-anchor="middle" fill="#fff">
    <rect x="56" y="116" width="220" height="44" rx="10" fill="#7c3aed"/><text x="166" y="145">Lua script</text>
    <rect x="296" y="116" width="220" height="44" rx="10" fill="#2563eb"/><text x="406" y="145">perform_pending</text>
    <rect x="536" y="116" width="220" height="44" rx="10" fill="#0891b2"/><text x="646" y="145">Driver coroutine</text>
    <rect x="776" y="116" width="220" height="44" rx="10" fill="#16a34a"/><text x="886" y="145">Worker scheduler</text>
    <rect x="1016" y="116" width="208" height="44" rx="10" fill="#475569"/><text x="1120" y="145">Kernel</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6">
    <line x1="166" y1="160" x2="166" y2="610"/><line x1="406" y1="160" x2="406" y2="610"/>
    <line x1="646" y1="160" x2="646" y2="610"/><line x1="886" y1="160" x2="886" y2="610"/>
    <line x1="1120" y1="160" x2="1120" y2="610"/>
  </g>

  <g font-size="16" fill="#0f172a">
    <rect x="72" y="178" width="188" height="40" rx="9" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="166" y="204" text-anchor="middle">con:query → yield</text>
    <path d="M260,198 L392,206" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

    <rect x="312" y="190" width="188" height="40" rx="9" fill="#dbeafe" stroke="#2563eb"/>
    <text x="406" y="216" text-anchor="middle">dispatch Pending</text>
    <path d="M500,214 L632,232" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

    <rect x="552" y="222" width="188" height="58" rx="9" fill="#cffafe" stroke="#0891b2"/>
    <text x="646" y="246" text-anchor="middle">stage + post send</text>
    <text x="646" y="268" text-anchor="middle" font-size="14" fill="#334155">SQE in the worker's ring</text>

    <rect x="552" y="296" width="188" height="58" rx="9" fill="#cffafe" stroke="#0891b2"/>
    <text x="646" y="320" text-anchor="middle">co_await receive</text>
    <text x="646" y="342" text-anchor="middle" font-size="14" fill="#334155">multishot, armed once</text>
    <path d="M740,326 L872,346" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="806" y="322" text-anchor="middle" font-size="14" fill="#15803d">suspend</text>

    <rect x="792" y="336" width="188" height="76" rx="9" fill="#dcfce7" stroke="#16a34a"/>
    <text x="886" y="360" text-anchor="middle">one io_uring_enter</text>
    <text x="886" y="382" text-anchor="middle" font-size="14" fill="#334155">submits the batch, waits</text>
    <text x="886" y="402" text-anchor="middle" font-size="14" fill="#334155">(spin budget is learned)</text>
    <path d="M980,370 L1106,378" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

    <rect x="1030" y="356" width="180" height="76" rx="9" fill="#e2e8f0" stroke="#475569"/>
    <text x="1120" y="380" text-anchor="middle">send · reply arrives</text>
    <text x="1120" y="402" text-anchor="middle" font-size="14" fill="#334155">task work → CQE</text>
    <text x="1120" y="422" text-anchor="middle" font-size="14" fill="#334155">(NAPI busy poll: opt.)</text>
    <path d="M1030,420 L980,444" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

    <rect x="792" y="436" width="188" height="40" rx="9" fill="#dcfce7" stroke="#16a34a"/>
    <text x="886" y="462" text-anchor="middle">reap → resume</text>
    <path d="M792,462 L740,480" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a)"/>

    <rect x="552" y="470" width="188" height="40" rx="9" fill="#cffafe" stroke="#0891b2"/>
    <text x="646" y="496" text-anchor="middle">ResultParser</text>
    <path d="M552,500 L500,522" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

    <rect x="312" y="512" width="188" height="40" rx="9" fill="#dbeafe" stroke="#2563eb"/>
    <text x="406" y="538" text-anchor="middle">push_result</text>
    <path d="M312,544 L260,562" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="72" y="556" width="188" height="40" rx="9" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="166" y="582" text-anchor="middle">lua_resume → rs</text>
  </g>

  <rect x="56" y="628" width="1168" height="64" rx="14" fill="#0f172a"/>
  <text x="84" y="668" fill="#f8fafc" font-size="19"><tspan font-weight="700">Many connections per worker:</tspan><tspan fill="#cbd5e1"> while one waits, the worker runs the others; every wait goes through the scheduler.</tspan></text>
</svg>
